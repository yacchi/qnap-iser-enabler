# Name of the packaged application.
QPKG_NAME="iSEREnabler"
# Display name shown on QTS Web UI.
QPKG_DISPLAY_NAME="iSER Enabler"
# Version of the packaged application (CI overwrites this from the git tag).
QPKG_VER="0.3.0"
# Author or maintainer of the package
QPKG_AUTHOR="yacchi"
# License for the packaged application
QPKG_LICENSE="GPL-3.0"
# One-line description of the packaged application
QPKG_SUMMARY="Enable RDMA / iSER on non-QNAP Mellanox ConnectX-4 or later cards via Advanced Network Driver"
# Preferred number in start/stop sequence.
QPKG_RC_NUM="101"
# Path to the shell script for starting and stopping the application.
QPKG_SERVICE_PROGRAM="iser-enabler.sh"
# Minimum QTS version requirement
QTS_MINI_VERSION="5.0.0"
# The service returns immediately; the RDMA wait runs in the background.
QPKG_TIMEOUT="30,30"
# Not published via QNAP's update XML.
QPKG_DISTRIBUTION_TYPE="1"
